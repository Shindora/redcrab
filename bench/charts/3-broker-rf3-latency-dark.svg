<line x1="16" x2="784" y1="716" y2="716" stroke="#2c2c2a"/>
<text x="16" y="736" font-size="11" fill="#f0efec" font-weight="600">LOCAL smoke numbers from a small Podman VM with memory-capped brokers; not a real benchmark. Publishable results</text>
<text x="16" y="751" font-size="11" fill="#f0efec" font-weight="600">will come from OpenMessaging Benchmark on dedicated Linux hosts with NVMe drives.</text>
<text x="16" y="770" font-size="11" fill="#c3c2b7">Hardware (from the result files): a Podman VM with 4 CPUs and 1941 MiB of memory, kernel 7.2.7-200.fc44.aarch64,</text>
<text x="16" y="785" font-size="11" fill="#c3c2b7">Podman 6.1.4. It ran the load clients and every system shown, each as 3 brokers, replication factor 3</text>
<text x="16" y="800" font-size="11" fill="#c3c2b7">(min.insync.replicas 2, acks=all), with each broker container capped at 384m.</text>
<text x="16" y="819" font-size="11" fill="#c3c2b7">Broker settings (from the result files): kafka and kafka-fsync: heap -Xms128m -Xmx128m; redpanda: --smp=1</text>
<text x="16" y="834" font-size="11" fill="#c3c2b7">--memory=256M; redcrab: container cap only. Containers have no CPU limit.</text>
<text x="16" y="853" font-size="11" fill="#c3c2b7">Each row has 1 to 2 runs of 30-60 s with the same settings: the colored marks and values show the latest run and the</text>
<text x="16" y="868" font-size="11" fill="#c3c2b7">thin gray marks under them the earlier runs. Results vary widely between runs (for example, redpanda baseline p99</text>
<text x="16" y="883" font-size="11" fill="#c3c2b7">was 2,244 and 115 ms in 2 runs). Latency percentiles have 1 ms resolution.</text>
<text x="16" y="902" font-size="11" fill="#c3c2b7">Rows marked capped hit the harness&#x27;s cap of 12 GiB written per run, replicas and probe included, so they ran shorter</text>
<text x="16" y="917" font-size="11" fill="#c3c2b7">than the unmarked rows, which ran their full time: redcrab max ran about 18 and 13 s instead of 30 s.</text>
<text x="16" y="936" font-size="11" fill="#c3c2b7">Runs from 2026-11-14 to 2026-11-15. Full table: python3 bench/bench.py compare (with --all for every run).</text>
</svg>
