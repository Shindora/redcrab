<line x1="16" x2="784" y1="698" y2="698" stroke="#2c2c2a"/>
<text x="16" y="718" font-size="11" fill="#f0efec" font-weight="600">LOCAL smoke numbers from a small Podman VM with memory-capped brokers; not a real benchmark. Publishable results</text>
<text x="16" y="733" font-size="11" fill="#f0efec" font-weight="600">will come from OpenMessaging Benchmark on dedicated Linux hosts with NVMe drives.</text>
<text x="16" y="752" font-size="11" fill="#c3c2b7">Hardware (from the result files): a Podman VM with 4 CPUs and 1941 MiB of memory, kernel 7.2.7-200.fc44.aarch64,</text>
<text x="16" y="767" font-size="11" fill="#c3c2b7">Podman 6.1.4. It ran the load clients and every system shown, each as 3 brokers, replication factor 3</text>
<text x="16" y="782" font-size="11" fill="#c3c2b7">(min.insync.replicas 2, acks=all), with each broker container capped at 384m.</text>
<text x="16" y="801" font-size="11" fill="#c3c2b7">Broker settings (from the result files): kafka and kafka-fsync: heap -Xms128m -Xmx128m; redpanda: --smp=1</text>
<text x="16" y="816" font-size="11" fill="#c3c2b7">--memory=256M. Containers have no CPU limit.</text>
<text x="16" y="835" font-size="11" fill="#c3c2b7">No run for redcrab: no replication yet. It runs only as 1 broker, replication factor 1, and the 1-broker charts</text>
<text x="16" y="850" font-size="11" fill="#c3c2b7">compare it.</text>
<text x="16" y="869" font-size="11" fill="#c3c2b7">Each row has 1 to 2 runs of 30-60 s with the same settings: the colored marks and values show the latest run and the</text>
<text x="16" y="884" font-size="11" fill="#c3c2b7">thin gray marks under them the earlier runs. Results vary widely between runs (for example, redpanda baseline p99</text>
<text x="16" y="899" font-size="11" fill="#c3c2b7">was 2,244 and 115 ms in 2 runs). Latency percentiles have 1 ms resolution.</text>
<text x="16" y="918" font-size="11" fill="#c3c2b7">Runs from 2026-11-14. Full table: python3 bench/bench.py compare (with --all for every run).</text>
</svg>
