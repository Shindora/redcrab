<line x1="16" x2="784" y1="736" y2="736" stroke="#e1e0d9"/>
<text x="16" y="756" font-size="11" fill="#0b0b0b" font-weight="600">LOCAL smoke numbers from a small Podman VM with memory-capped brokers; not a real benchmark. Publishable results</text>
<text x="16" y="771" font-size="11" fill="#0b0b0b" font-weight="600">will come from OpenMessaging Benchmark on dedicated Linux hosts with NVMe drives.</text>
<text x="16" y="790" font-size="11" fill="#52514e">Hardware (from the result files): a Podman VM with 4 CPUs and 1941 MiB of memory, kernel 7.2.7-200.fc44.aarch64,</text>
<text x="16" y="805" font-size="11" fill="#52514e">Podman 6.1.4. It ran the load clients and the solid marks&#x27; 3-broker clusters with replication factor (RF) 3, each</text>
<text x="16" y="820" font-size="11" fill="#52514e">broker capped at 384m.</text>
<text x="16" y="839" font-size="11" fill="#52514e">Hatched or hollow marks (redcrab): 1 broker at RF 1. They ran in the same VM with the same load client and the same</text>
<text x="16" y="854" font-size="11" fill="#52514e">384m broker memory cap, but they keep 1 copy of each record instead of 3, so they do less work per record and are</text>
<text x="16" y="869" font-size="11" fill="#52514e">not comparable.</text>
<text x="16" y="888" font-size="11" fill="#52514e">Each mark is a single run of 30-60 s. Results vary widely between runs (for example, redpanda baseline p99 was 8,</text>
<text x="16" y="903" font-size="11" fill="#52514e">24, 2,244 and 115 ms in 4 runs). Latency percentiles have 1 ms resolution.</text>
<text x="16" y="922" font-size="11" fill="#52514e">Latest run per target and workload, from 2026-11-14. Full table: python3 bench/bench.py compare.</text>
</svg>
