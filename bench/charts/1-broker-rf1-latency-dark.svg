<line x1="16" x2="784" y1="752" y2="752" stroke="#2c2c2a"/>
<text x="16" y="772" font-size="11" fill="#f0efec" font-weight="600">LOCAL smoke numbers from a small Podman VM with memory-capped brokers; not a real benchmark. Publishable results</text>
<text x="16" y="787" font-size="11" fill="#f0efec" font-weight="600">will come from OpenMessaging Benchmark on dedicated Linux hosts with NVMe drives.</text>
<text x="16" y="806" font-size="11" fill="#c3c2b7">Hardware (from the result files): a Podman VM with 4 CPUs and 1941 MiB of memory, kernel 7.2.7-200.fc44.aarch64,</text>
<text x="16" y="821" font-size="11" fill="#c3c2b7">Podman 6.1.4. It ran the load clients and every system shown, each as 1 broker, replication factor 1</text>
<text x="16" y="836" font-size="11" fill="#c3c2b7">(min.insync.replicas 1, acks=all), with each broker container capped at 384m.</text>
<text x="16" y="855" font-size="11" fill="#c3c2b7">Broker settings (from the result files): kafka and kafka-fsync: heap -Xms128m -Xmx128m; redpanda: --smp=1</text>
<text x="16" y="870" font-size="11" fill="#c3c2b7">--memory=256M; redcrab: container cap only. Containers have no CPU limit.</text>
<text x="16" y="889" font-size="11" fill="#c3c2b7">Each row has 1 to 3 runs of 30-60 s with the same settings: the colored marks and values show the latest run and the</text>
<text x="16" y="904" font-size="11" fill="#c3c2b7">thin gray marks under them the earlier runs. Results vary widely between runs (for example, kafka-fsync baseline p99</text>
<text x="16" y="919" font-size="11" fill="#c3c2b7">was 27, 159 and 8 ms in 3 runs). Latency percentiles have 1 ms resolution.</text>
<text x="16" y="938" font-size="11" fill="#c3c2b7">Runs from 2026-11-14. Full table: python3 bench/bench.py compare (with --all for every run).</text>
</svg>
