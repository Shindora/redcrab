<line x1="16" x2="784" y1="734" y2="734" stroke="#e1e0d9"/>
<text x="16" y="754" font-size="11" fill="#0b0b0b" font-weight="600">LOCAL smoke numbers from a small Podman VM with memory-capped brokers; not a real benchmark. Publishable results</text>
<text x="16" y="769" font-size="11" fill="#0b0b0b" font-weight="600">will come from OpenMessaging Benchmark on dedicated Linux hosts with NVMe drives.</text>
<text x="16" y="788" font-size="11" fill="#52514e">Hardware (from the result files): a Podman VM with 4 CPUs and 1941 MiB of memory, kernel 7.2.7-200.fc44.aarch64,</text>
<text x="16" y="803" font-size="11" fill="#52514e">Podman 6.1.4. It ran the load clients and every system shown, each as 3 brokers, replication factor 3</text>
<text x="16" y="818" font-size="11" fill="#52514e">(min.insync.replicas 2, acks=all), with each broker container capped at 384m.</text>
<text x="16" y="837" font-size="11" fill="#52514e">Broker settings (from the result files): kafka and kafka-fsync: heap -Xms128m -Xmx128m; redpanda: --smp=1</text>
<text x="16" y="852" font-size="11" fill="#52514e">--memory=256M; redcrab: container cap only. Containers have no CPU limit.</text>
<text x="16" y="871" font-size="11" fill="#52514e">Each row has 1 to 2 runs of 30-60 s with the same settings: the colored marks and values show the latest run and the</text>
<text x="16" y="886" font-size="11" fill="#52514e">thin gray marks under them the earlier runs. Results vary widely between runs (for example, redpanda baseline p99</text>
<text x="16" y="901" font-size="11" fill="#52514e">was 2,244 and 115 ms in 2 runs). Latency percentiles have 1 ms resolution.</text>
<text x="16" y="920" font-size="11" fill="#52514e">Rows marked capped hit the harness&#x27;s cap of 12 GiB written per run, replicas and probe included, so each run sent</text>
<text x="16" y="935" font-size="11" fill="#52514e">fewer records than its probe planned for the full time, unlike the unmarked rows. At the rates they measured,</text>
<text x="16" y="950" font-size="11" fill="#52514e">redcrab max ran about 18 and 13 s instead of 30 s; redpanda max ran about 16 and 17 s instead of 30 s.</text>
<text x="16" y="969" font-size="11" fill="#52514e">Runs from 2026-11-14 to 2026-11-15. Full table: python3 bench/bench.py compare (with --all for every run).</text>
</svg>
