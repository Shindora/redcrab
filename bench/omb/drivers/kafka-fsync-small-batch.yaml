# OpenMessaging Benchmark driver: Apache Kafka 4.4.0 with flush.messages=1 (fsync per append), comparable to Redpanda's fsync before ack.
# Use with workloads/small-batch.yaml only. Client settings mirror bench/bench.py; point bootstrap.servers at the real cluster.
name: kafka-fsync-small-batch
driverClass: io.openmessaging.benchmark.driver.kafka.KafkaBenchmarkDriver
replicationFactor: 3
topicConfig: |
  min.insync.replicas=2
  flush.messages=1
commonConfig: |
  bootstrap.servers=localhost:9092
producerConfig: |
  acks=all
  linger.ms=0
  batch.size=16384
consumerConfig: |
  auto.offset.reset=earliest
  enable.auto.commit=false
  fetch.max.bytes=16777216
