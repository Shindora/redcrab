name: bench
x-kafka: &kafka
  image: ${KAFKA_IMAGE:?set by bench.py}
  mem_limit: ${BROKER_MEM_LIMIT:?set by bench.py}
  environment: &env
    CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@bench-1:9093,2@bench-2:9093,3@bench-3:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
    KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: ${KAFKA_FLUSH_MESSAGES:-9223372036854775807}
    KAFKA_HEAP_OPTS: ${BROKER_HEAP:?set by bench.py}
services:
  bench-1:
    <<: *kafka
    container_name: bench-1
    environment: {<<: *env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bench-1:9092}
  bench-2:
    <<: *kafka
    container_name: bench-2
    environment: {<<: *env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bench-2:9092}
  bench-3:
    <<: *kafka
    container_name: bench-3
    environment: {<<: *env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bench-3:9092}
