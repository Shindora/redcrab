[package]
name = "redcrab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
bytes = "1.12.1"
crc32c = "0.6.9"
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client", "messages_enums"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
