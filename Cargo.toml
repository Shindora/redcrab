[package]
name = "redcrab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
bytes = "1.12.1"
crc32c = "0.6.9"
kafka-protocol = { git = "https://github.com/tychedelia/kafka-protocol-rs", rev = "37fed766406bcc1f97e677781cce68bfedcf8a96", default-features = false, features = ["broker", "client", "messages_enums"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6.5", features = ["all"] }

[features]
# Test hook: SIGUSR1 cuts every log back to what was fsynced and exits, like a power failure.
failpoints = []

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "fetch"
harness = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
